# ─────────────────────────────────────────────────────────────────────────────
# Configuración BASE (sin secretos — este archivo SÍ se sube a git).
# Los valores sensibles se leen de variables de entorno. Para desarrollo local,
# poné tus valores reales en application-local.properties (está en .gitignore).
# ─────────────────────────────────────────────────────────────────────────────

# Si no indicás otro perfil, se usa "local" (carga application-local.properties si existe)
spring.profiles.default=local

# ── Base de datos ────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inmobiliariadelcastillo}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# "update" crea/ajusta tablas solas: cómodo para desarrollo. En producción usar "validate" + migraciones.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Necesario: algunos endpoints serializan entidades con relaciones LAZY durante la respuesta
spring.jpa.open-in-view=true

server.port=8080

# ── JWT ──────────────────────────────────────────────────────────────────────
# JWT_SECRET: mínimo 32 caracteres aleatorios. Generá uno con:  openssl rand -base64 48
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ── CORS (orígenes del frontend, separados por coma) ─────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ── Cookie de sesión (el token vive en una cookie HttpOnly, no en localStorage) ──
# secure=true exige HTTPS (producción). samesite=Lax si frontend y API comparten sitio;
# si están en dominios distintos: COOKIE_SAMESITE=None (y secure=true).
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.samesite=${COOKIE_SAMESITE:Lax}

# ── Datos de ejemplo al primer arranque ──────────────────────────────────────
# En producción: SEED_ENABLED=false
app.seed.enabled=${SEED_ENABLED:true}
# Contraseña inicial del usuario "admin". Si queda vacía se genera una aleatoria y se muestra en el log.
app.seed.admin-password=${ADMIN_INITIAL_PASSWORD:}

# ── Firebase (OPCIONAL) ──────────────────────────────────────────────────────
# Descomentar y configurar si se desea usar login con Firebase Auth
# firebase.config-path=classpath:firebase-service-account.json
